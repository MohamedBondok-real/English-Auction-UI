<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Martlet — The Gilded Hour · Live English Auction</title>
    <meta
      name="description"
      content="Martlet, London. An English auction in the open ascending manner — sixteen lots, live bidding, the fall of the hammer. A demonstration saleroom built in TypeScript."
    />
    <meta name="theme-color" content="#f3ede2" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta property="og:title" content="Martlet — The Gilded Hour" />
    <meta
      property="og:description"
      content="An English auction, live. Sixteen lots, open ascending bids, and the fall of the hammer."
    />
    <script>
      // Paint the correct theme before first paint (no flash of wrong mood).
      (function () {
        try {
          var stored = localStorage.getItem('martlet.theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored === 'light' || stored === 'dark' ? stored : prefersDark ? 'dark' : 'light';
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          root.style.colorScheme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', theme === 'dark' ? '#0c0f0d' : '#f3ede2');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 3rem; font-family: Georgia, serif; text-align: center">
        <h1>Martlet</h1>
        <p>The saleroom requires JavaScript to conduct the sale.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
